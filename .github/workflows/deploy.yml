name: Deploy to EC2 (No Docker Hub)

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build API module only
        run: mvn clean package -pl api -am -DskipTests

      - name: Build Docker Image
        run: docker build -t spring-app .

      - name: Save Docker Image
        run: docker save spring-app -o spring-app.tar

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "spring-app.tar"
          target: "/home/ubuntu/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop spring-app || true
            docker rm spring-app || true
            docker rmi spring-app || true
            docker load -i spring-app.tar
            docker run -d -p 8080:8080 --name spring-app spring-app
